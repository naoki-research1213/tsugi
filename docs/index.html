:root{
  color-scheme:dark;
  --bg:#000;--fg:#fff;--muted:#a09eaa;--line:#2b2a33;--raised:#17161c;--field:#201f27;--warn:#ff9fa8;
  --lemon:#f7e07a;
  --jp:"Zen Maru Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --num:"Tsugi Digits","Zen Maru Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.6 var(--jp);overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg{display:block;fill:currentColor}
.wrap{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}

/* Home */
.brand{font-weight:900;font-size:30px;line-height:1.2;margin:8px 0 28px}
.routines{display:grid;gap:30px}
.routine{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:6px 14px;align-items:center}
.routine .open{text-align:left;min-width:0}
.routine h2{margin:0;font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.sample{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:8px;vertical-align:3px}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.go{width:60px;height:60px;border-radius:50%;background:var(--lemon);color:#000;display:grid;place-items:center}
.go:active{transform:scale(.93)}
.go:disabled{background:var(--field);color:var(--muted);cursor:default}
.bar{grid-column:1/-1;display:flex;gap:2px;height:8px}
.bar i{display:block;min-width:3px;border-radius:2px}
.empty{color:var(--muted);margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;padding-top:28px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,#000 42%);pointer-events:none}
.dock .btn{pointer-events:auto;display:block;width:100%;max-width:528px;margin:0 auto}
.btn{height:56px;border-radius:16px;background:var(--fg);color:#000;font-weight:700;font-size:17px}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--field);color:var(--muted);cursor:default}
.btn.quiet{background:var(--raised);color:var(--fg)}

/* Editor */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;min-height:44px}
.link{min-height:44px;padding:0 4px;font-weight:700;color:var(--muted)}
.link.danger{color:var(--warn)}
.title-in{width:100%;background:none;border:0;font-size:28px;font-weight:900;line-height:1.3;padding:0;outline:0}
.title-in::placeholder,.name::placeholder{color:#6f6d79}
.sum{margin:6px 0 12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.edit-bar{height:8px;display:flex;gap:2px;margin-bottom:12px}
.edit-bar i{display:block;min-width:3px;border-radius:2px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr) 40px;align-items:center;column-gap:4px;padding:12px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.step.drag{background:var(--raised);border-radius:10px}
.handle{width:36px;height:44px;display:grid;place-items:center;touch-action:none;cursor:grab}
.handle i{width:16px;height:16px;border-radius:50%;display:block}
.name{width:100%;background:none;border:0;outline:0;padding:8px 0;font-size:18px;font-weight:700;min-width:0}
.del{width:40px;height:44px;display:grid;place-items:center;color:var(--muted)}
.time{grid-column:2/-1;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.time input{width:58px;height:40px;text-align:center;background:var(--field);border:0;border-radius:10px;color:var(--fg);font:600 19px var(--num);-moz-appearance:textfield;outline:0}
.time input:focus{box-shadow:0 0 0 2px var(--fg)}
.time input::-webkit-outer-spin-button,.time input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.note-in{grid-column:2/-1;width:100%;margin-top:8px;padding:9px 12px;background:var(--field);border:0;border-radius:10px;outline:0;resize:none;font-size:15px;line-height:1.5;field-sizing:content;min-height:42px;max-height:130px}
.note-in:focus{box-shadow:0 0 0 2px var(--fg)}
.note-in::placeholder{color:#6f6d79}
.paste-title{font-size:28px;font-weight:900;line-height:1.3;margin:0 0 6px}
.paste-help{color:var(--muted);font-size:14px;margin:0 0 12px}
.format{background:var(--raised);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.7;overflow-x:auto;white-space:pre}
.paste-in{width:100%;min-height:210px;background:var(--field);border:0;border-radius:14px;padding:14px;outline:0;resize:vertical;font-size:16px;line-height:1.6}
.paste-in:focus{box-shadow:0 0 0 2px var(--fg)}
.result{margin-top:18px;display:grid;gap:16px}
.result h3{margin:0;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.result ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.result li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px}
.result li b{font-weight:700;overflow-wrap:anywhere}
.result li span{font:600 16px var(--num)}
.result li small{grid-column:1/-1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.errors{margin:14px 0 0;padding:0;list-style:none;color:var(--warn);font-size:14px;display:grid;gap:4px;overflow-wrap:anywhere}
.dock-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:528px;margin:0 auto}
.dock .dock-row .btn{max-width:none}
.nudge{min-width:48px;height:40px;border-radius:10px;background:var(--raised);color:var(--fg);font-weight:700;font-size:14px}
.nudge:first-child{margin-right:auto}
.nudge.right{margin-left:auto}
.add{width:100%;height:56px;color:var(--fg);font-weight:700;text-align:left;padding-left:40px}
.group-label{margin:26px 0 8px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raised);padding:4px;border-radius:14px}
.seg button{min-height:46px;border-radius:11px;font-size:14px;font-weight:700;color:var(--muted);padding:4px 6px;line-height:1.3}
.seg button[aria-pressed=true]{background:var(--fg);color:#000}

/* Timer */
.run{position:fixed;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));color:#fff;background:#000}
.layer.level{color:#000;background:var(--c);pointer-events:none;clip-path:inset(calc((1 - var(--r))*100%) 0 0 0);transition:clip-path .28s linear}
.run.jump .layer.level{transition:clip-path .62s cubic-bezier(.16,.84,.28,1)}
.r-top{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;min-height:48px}
.icon{width:48px;height:48px;display:grid;place-items:center}
.r-title{text-align:center;font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r-pos{font:600 15px var(--num);display:block}
.r-main{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;text-align:center}
.r-main>h1,.r-main>.digits,.r-main>.plus{flex:none}
.r-step{font-size:clamp(26px,8vw,40px);font-weight:900;line-height:1.3;margin:0;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.digits{font:600 min(29vw,21vh,190px)/1.08 var(--num);display:flex;justify-content:center;margin:2px 0 4px;letter-spacing:0}
.digits i{font-style:normal;display:block;width:.61em;text-align:center}
.digits i.c{width:.3em}
.digits i.s{width:.5em}
.run.paused .digits{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.62}}
.plus{height:44px;padding:0 20px;border-radius:22px;border:2px solid currentColor;font-weight:700;font-size:16px}
.plus:active{transform:scale(.95)}
.r-gap{flex:.55 1 0;min-height:0}
.run.no-note .r-gap{flex:1 1 0}
.r-note{flex:1 1 0;min-height:0;width:100%;max-width:520px;margin:14px 0 10px;overflow:hidden;font-weight:700;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere;text-wrap:pretty}
.r-note.clamp{display:-webkit-box;-webkit-box-orient:vertical}
.r-next{text-align:center;font-size:15px;line-height:1.5;margin:0 0 18px;min-height:45px;overflow-wrap:anywhere}
.r-next b{font-weight:700}
.r-ctl{display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;justify-items:center;max-width:360px;width:100%;margin:0 auto}
.ctl{display:grid;justify-items:center;gap:2px;min-width:72px;min-height:64px;align-content:center;font-size:13px;font-weight:700}
.ctl:disabled{opacity:.3;cursor:default}
.ctl:active{transform:scale(.94)}
.main-ctl{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;border:3px solid currentColor}
.main-ctl:active{transform:scale(.94)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:560px;background:var(--raised);border-radius:22px 22px 0 0;padding-top:24px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.sheet h2{margin:0;font-size:20px;font-weight:900}
.sheet p{margin:0 0 8px;color:var(--muted);font-size:14px}
.sheet .btn.quiet{background:var(--field);color:var(--warn)}

/* Finish */
.done{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;overflow-y:auto}
.stripes{flex:1 0 auto;display:flex;flex-direction:column;min-height:52%}
.stripe{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));color:#000;font-weight:700;background:var(--c);transform-origin:left;animation:sweep .55s cubic-bezier(.16,.84,.28,1) backwards;animation-delay:calc(var(--n)*70ms)}
.stripe:first-child{padding-top:env(safe-area-inset-top,0px)}
.stripe span:first-child{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.stripe span:last-child{font:600 18px var(--num)}
@keyframes sweep{from{transform:scaleX(0)}}
.done-foot{padding-top:24px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:4px}
.done-foot h1{margin:0;font-size:30px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.done-foot p{margin:0 0 16px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  .layer.level,.run.jump .layer.level{transition:none}
  .run.paused .digits{animation:none;opacity:.6}
  .stripe{animation:none}
}
</style>
</head>

<div id="app"></div>
<script>
(() => {
'use strict';
const KEY = 'tsugi.v1';
const PAL = ['#f7e07a', '#8ee6c2', '#8fc9ff', '#c9b4ff', '#ffb3c8', '#ffc896'];
const app = document.getElementById('app');
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const color = i => PAL[i % PAL.length];
const ICON = {
  play: '<svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5.6c0-1.1 1.2-1.8 2.2-1.2l10 6.4c.9.6.9 1.9 0 2.4l-10 6.4c-1 .6-2.2-.1-2.2-1.2z"/></svg>',
  pause: '<svg width="38" height="38" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.6"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.6"/></svg>',
  next: '<svg width="32" height="32" viewBox="0 0 24 24"><path d="M4.5 6.4c0-1 1.1-1.6 2-1l9 5.6c.8.5.8 1.6 0 2.1l-9 5.6c-.9.6-2 0-2-1z"/><rect x="17" y="5" width="3" height="14" rx="1.3"/></svg>',
  prev: '<svg width="32" height="32" viewBox="0 0 24 24"><path d="M19.5 6.4c0-1-1.1-1.6-2-1l-9 5.6c-.8.5-.8 1.6 0 2.1l9 5.6c.9.6 2 0 2-1z"/><rect x="4" y="5" width="3" height="14" rx="1.3"/></svg>',
  close: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>'
};

const sampleSteps = list => list.map(([name, sec, note]) => ({ id: uid(), name, sec, note: note || '' }));
const defaults = () => ({
  run: null,
  routines: [
    { id: uid(), name: '朝の支度', auto: true, sample: true, steps: sampleSteps([['水を飲む', 60, 'コップ1杯'], ['顔を洗う', 120], ['歯を磨く', 180, '奥歯の裏側まで。終わったらコップも洗っておく。'], ['着替える', 300], ['朝ごはん', 900, '食べながらスマホを見ない'], ['持ち物を確認', 120, '財布、鍵、スマホ、学生証、PCの充電器、午後の実験ノート。雨の予報なら折りたたみ傘も入れる。TAの日は採点済みの答案と出席表を忘れない。研究室に寄る日はUSBメモリと実験データの入ったSSDも確認する。']]) },
    { id: uid(), name: '夜の片付け', auto: true, sample: true, steps: sampleSteps([['食器を洗う', 600], ['机を片付ける', 300], ['ゴミをまとめる', 180, '明日が回収日か確認'], ['明日の服を出す', 120]]) }
  ]
});
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.routines)) {
        /* Untouched examples follow the current example text. */
        const fresh = defaults().routines;
        d.routines = d.routines.map(r => r.sample ? (fresh.find(x => x.name === r.name) || r) : r);
        return d;
      }
    }
  } catch (e) {}
  return defaults();
}
let store = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const fmt = sec => { const a = Math.abs(Math.round(sec)); return Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
const clock = ms => { const d = new Date(ms); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
const readableDur = sec => { const m = Math.floor(sec / 60), s = sec % 60; return m && s ? m + '分' + s + '秒' : m ? m + '分' : s + '秒'; };
const usable = r => r.steps.filter(s => s.sec > 0);
const total = r => usable(r).reduce((a, s) => a + s.sec, 0);
const segments = r => usable(r).map((s, i) => `<i style="flex:${s.sec} 1 0;background:${color(i)}"></i>`).join('');

/* Navigation: one extra history entry keeps Android's back button inside the app. */
let view = 'home', editing = null;
function pushSub() { try { if (!(history.state && history.state.sub)) history.pushState({ sub: 1 }, ''); } catch (e) {} }
function toHome() {
  view = 'home'; renderHome();
  try { if (history.state && history.state.sub) history.back(); } catch (e) {}
}
addEventListener('popstate', () => {
  if (view === 'run') { pushSub(); openStopSheet(); return; }
  if (view === 'edit') { leaveEdit(false); return; }
  if (view === 'done' || view === 'paste') { view = 'home'; renderHome(); }
});

/* Bulk entry. Each block is a title line followed by "タスク名 mm:ss コメント" lines. */
function readTime(token) {
  let m;
  if ((m = token.match(/^(\d{1,3}):(\d{1,2})$/))) return +m[2] > 59 ? -1 : +m[1] * 60 + +m[2];
  if ((m = token.match(/^(\d{1,3})$/))) return +m[1] * 60;
  if ((m = token.match(/^(?:(\d{1,3})分)?(?:(\d{1,2})秒)?$/)) && (m[1] || m[2])) return (+m[1] || 0) * 60 + (+m[2] || 0);
  return null;
}
function parseTask(line) {
  const tokens = line.replace(/^(?:[-*][\s　]+|[・•][\s　]*|\d+[.)][\s　]+)/, '').split(/[\s　]+/);
  const colon = tokens.findIndex((t, i) => i > 0 && /^\d{1,3}:\d{1,2}$/.test(t));
  const at = colon > 0 ? colon : tokens.findIndex((t, i) => i > 0 && readTime(t) !== null);
  if (at < 1) return { error: '時間が読み取れません。mm:ss の形で書いてください' };
  const sec = readTime(tokens[at]);
  if (sec <= 0) return { error: '時間は0:01以上で、秒は59以下にしてください' };
  return { name: tokens.slice(0, at).join(' '), sec, note: tokens.slice(at + 1).join(' ') };
}
function parseRoutines(text) {
  const normalized = text.replace(/\r/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/：/g, ':');
  const routines = [], errors = [];
  let cur = null;
  normalized.split('\n').forEach((raw, i) => {
    const line = raw.trim();
    if (line.startsWith('```')) return;
    if (!line) { cur = null; return; }
    if (!cur) { cur = { name: line.replace(/^#+\s*/, ''), line: i + 1, steps: [] }; routines.push(cur); return; }
    const t = parseTask(line);
    if (t.error) { errors.push(`${i + 1}行目「${line}」: ${t.error}`); cur.bad = true; }
    else cur.steps.push(t);
  });
  routines.forEach(r => { if (!r.steps.length && !r.bad) errors.push(`${r.line}行目「${r.name}」: タスクの行がありません。ルーティン名の次の行にタスクを書いてください`); });
  return { routines, errors };
}
function openPaste() {

  app.innerHTML = `<div class="wrap">
    <div class="top"><button class="link" id="back">戻る</button></div>
    <h1 class="paste-title">テキストから追加</h1>
    <p class="paste-help">この形式で貼り付けます。空行で区切ると複数のルーティンをまとめて追加できます。コメントは省略できます。</p>
    <div class="format">朝の支度
水を飲む 01:00 コップ1杯
歯を磨く 03:00 奥歯の裏側まで</div>
    <textarea class="paste-in" id="paste" aria-label="ルーティンのテキスト" placeholder="ここに貼り付け" autocomplete="off"></textarea>
    <ul class="errors" id="errors"></ul>

  </div>
  <div class="dock"><button class="btn" id="import" disabled>追加する</button></div>`;
  const input = document.getElementById('paste'), btn = document.getElementById('import');
  let parsed = { routines: [], errors: [] };
  const refresh = () => {

    document.getElementById('result').innerHTML = parsed.routines.filter(r => r.steps.length).map(r => `<section><h3>${esc(r.name)}</h3><ol>${r.steps.map(s => `<li><b>${esc(s.name)}</b><span>${fmt(s.sec)}</span>${s.note ? `<small>${esc(s.note)}</small>` : ''}</li>`).join('')}</ol></section>`).join('');
    const n = parsed.routines.length;
    btn.disabled = !n || parsed.errors.length > 0;

  };
  input.oninput = refresh;
  document.getElementById('back').onclick = toHome;
  btn.onclick = () => {
    parsed.routines.forEach(r => store.routines.push({ id: uid(), name: r.name, auto: true, steps: r.steps.map(s => ({ id: uid(), name: s.name, sec: s.sec, note: s.note })) }));

/* Home */

  const now = Date.now();
  app.innerHTML = `<div class="wrap">
    <div class="brand">ツギ</div>
    <div class="routines">${store.routines.length ? store.routines.map(r => {

      return `<section class="routine">

  </div>

    const r = { id: uid(), name: '', auto: true, steps: [{ id: uid(), name: '', sec: 180 }], fresh: true };

}

/* Editor */
function openEdit(id) {
  editing = store.routines.find(r => r.id === id);
  if (!editing) return;
  view = 'edit'; pushSub(); renderEdit();
  if (editing.fresh) document.getElementById('rname').focus();
}
function leaveEdit(viaButton) {
  const r = editing;
  r.steps = r.steps.filter(s => s.name.trim() || r.steps.length === 1);
  if (r.fresh && !r.name.trim() && !r.steps.some(s => s.name.trim())) store.routines = store.routines.filter(x => x !== r);
  delete r.fresh;
  save(); editing = null;
  if (viaButton) toHome(); else { view = 'home'; renderHome(); }
}
function touched() { delete editing.sample; save(); }
function renderEdit() {
  const r = editing;
  app.innerHTML = `<div class="wrap">
    <div class="top"><button class="link" id="back">保存して戻る</button><button class="link danger" id="del">削除</button></div>
    <input class="title-in" id="rname" aria-label="ルーティンの名前" placeholder="ルーティンの名前" maxlength="40" value="${esc(r.name)}" autocomplete="off">
    <div class="sum" id="sum"></div>
    <div class="edit-bar" id="ebar"></div>
    <div id="steps"></div>
    <button class="add" id="add">タスクを追加</button>
    <div class="group-label">時間が来たら</div>
    <div class="seg">
      <button id="auto1" aria-pressed="${r.auto}">自動で次へ進む</button>
      <button id="auto0" aria-pressed="${!r.auto}">次へを押すまで待つ</button>
    </div>
  </div>
  <div class="dock"><button class="btn" id="start">このルーティンを始める</button></div>`;
  renderSteps(); refreshSum();
  document.getElementById('back').onclick = () => leaveEdit(true);
  document.getElementById('rname').oninput = e => { r.name = e.target.value; touched(); };
  document.getElementById('add').onclick = () => {
    const s = { id: uid(), name: '', sec: 180 }; r.steps.push(s); touched(); renderSteps(); refreshSum();
    app.querySelector(`[data-id="${s.id}"] .name`).focus();
  };
  const setAuto = v => { r.auto = v; touched(); document.getElementById('auto1').setAttribute('aria-pressed', v); document.getElementById('auto0').setAttribute('aria-pressed', !v); };
  document.getElementById('auto1').onclick = () => setAuto(true);
  document.getElementById('auto0').onclick = () => setAuto(false);
  document.getElementById('start').onclick = () => {
    if (!total(r)) return;
    const id = r.id; delete r.fresh; save(); editing = null; startRun(id);
  };
  const del = document.getElementById('del');
  del.onclick = () => {
    if (del.dataset.armed) { store.routines = store.routines.filter(x => x !== r); save(); editing = null; toHome(); return; }
    del.dataset.armed = 1; del.textContent = 'もう一度押すと削除';
    setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = '削除'; } }, 3000);
  };
}
function refreshSum() {
  const r = editing, t = total(r);
  document.getElementById('sum').textContent = `${usable(r).length}個のタスク、合計${readableDur(t)}`;
  document.getElementById('ebar').innerHTML = segments(r);
  document.getElementById('start').disabled = !t;
}
function renderSteps() {
  const r = editing, box = document.getElementById('steps');
  box.innerHTML = r.steps.map((s, i) => `<div class="step" data-id="${s.id}">
    <div class="handle" tabindex="0" role="button" aria-label="${i + 1}番目のタスクを並べ替える"><i style="background:${color(i)}"></i></div>
    <input class="name" aria-label="タスク名" placeholder="タスク名" maxlength="40" value="${esc(s.name)}" autocomplete="off">
    <button class="del" aria-label="このタスクを削除">${ICON.close.replace(/24" height="24/, '20" height="20')}</button>
    <div class="time">
      <button class="nudge minus">−1分</button>
      <input class="m" type="number" inputmode="numeric" min="0" max="599" aria-label="分" value="${Math.floor(s.sec / 60)}"><span>分</span>
      <input class="s" type="number" inputmode="numeric" min="0" max="59" aria-label="秒" value="${s.sec % 60}"><span>秒</span>
      <button class="nudge right add1">+1分</button>
    </div>
    <textarea class="note-in" rows="1" aria-label="コメント" placeholder="コメント（なくても可）">${esc(s.note || '')}</textarea>
  </div>`).join('');
  box.querySelectorAll('.step').forEach(row => {
    const s = r.steps.find(x => x.id === row.dataset.id);
    const m = row.querySelector('.m'), se = row.querySelector('.s');
    row.querySelector('.name').oninput = e => { s.name = e.target.value; touched(); };
    row.querySelector('.note-in').oninput = e => { s.note = e.target.value; touched(); };
    const read = () => {
      s.sec = Math.min(35999, Math.max(0, (parseInt(m.value, 10) || 0) * 60 + (Math.min(59, parseInt(se.value, 10) || 0))));
      touched(); refreshSum();
    };
    m.oninput = se.oninput = read;
    const nudge = d => { s.sec = Math.min(35999, Math.max(0, s.sec + d)); m.value = Math.floor(s.sec / 60); se.value = s.sec % 60; touched(); refreshSum(); };
    row.querySelector('.minus').onclick = () => nudge(-60);
    row.querySelector('.add1').onclick = () => nudge(60);
    row.querySelector('.del').onclick = () => { r.steps = r.steps.filter(x => x !== s); touched(); renderSteps(); refreshSum(); };

}
function commitOrder(box) {
  const r = editing, order = [...box.children].map(el => el.dataset.id);
  r.steps.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  touched(); renderSteps(); refreshSum();
}
function attachDrag(row, box) {
  const h = row.querySelector('.handle');
  let active = false;
  h.addEventListener('pointerdown', e => { e.preventDefault(); active = true; try { h.setPointerCapture(e.pointerId); } catch (x) {} row.classList.add('drag'); });
  h.addEventListener('pointermove', e => {
    if (!active) return;
    const after = [...box.children].find(el => { if (el === row) return false; const b = el.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
    if (after ? row.nextElementSibling !== after : box.lastElementChild !== row) box.insertBefore(row, after || null);
  });
  const end = () => { if (!active) return; active = false; row.classList.remove('drag'); commitOrder(box); };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  h.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && row.previousElementSibling) box.insertBefore(row, row.previousElementSibling);
    else if (e.key === 'ArrowDown' && row.nextElementSibling) box.insertBefore(row.nextElementSibling, row);
    else return;
    e.preventDefault(); const id = row.dataset.id; commitOrder(box);
    box.querySelector(`[data-id="${id}"] .handle`).focus();
  });
}

/* Sound */
let audio = null, wake = null;
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
function chime(notes = [[660, 0], [880, .13]]) {
  if (navigator.vibrate) { try { navigator.vibrate(notes.length > 1 ? [120, 60, 120] : 90); } catch (e) {} }
  if (!audio || audio.state !== 'running') return;
  notes.forEach(([f, t]) => {
    const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.3, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .3);
    o.connect(g).connect(audio.destination); o.start(at); o.stop(at + .32);
  });
}
async function holdWake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

/* Timer */
let run = null, tickId = null, shownTime = '', jumpTimer = null;
const ms = i => run.steps[i].sec * 1000;
const leftNow = now => run.endAt != null ? run.endAt - now : run.left;
function startRun(id) {
  const r = store.routines.find(x => x.id === id);
  if (!r) return;
  const steps = usable(r).map((s, i) => ({ name: s.name.trim() || `タスク${i + 1}`, sec: s.sec, note: (s.note || '').trim() }));
  if (!steps.length) return;
  unlockAudio();
  run = { name: r.name.trim() || '名前なし', auto: r.auto !== false, steps, i: 0, endAt: Date.now() + steps[0].sec * 1000, left: 0, spent: steps.map(() => 0), warned: false, over: false };
  store.run = run; save();
  showRun();
  chime();
}
function layerHTML(inert) {
  return `<header class="r-top">
      <button class="icon" data-act="close" aria-label="ルーティンをやめる">${ICON.close}</button>
      <div class="r-title"><span data-s="routine"></span><span class="r-pos" data-s="pos"></span></div>
      <span></span>
    </header>
    <main class="r-main">
      <div class="r-gap"></div>
      <h1 class="r-step" data-s="step"></h1>
      <div class="digits" data-s="time" ${inert ? '' : 'role="timer"'}></div>
      <button class="plus" data-act="plus">+1分</button>
      <p class="r-note" data-s="note"></p>
    </main>
    <p class="r-next" data-s="next"></p>
    <footer class="r-ctl">
      <button class="ctl" data-act="prev">${ICON.prev}<span>戻る</span></button>
      <button class="main-ctl" data-act="toggle" data-s="toggle"></button>
      <button class="ctl" data-act="next">${ICON.next}<span data-s="nextLabel">次へ</span></button>
    </footer>`;
}
function showRun() {
  view = 'run'; pushSub();
  shownTime = '';
  app.innerHTML = `<div class="run" id="run">
    <div class="layer">${layerHTML(false)}</div>
    <div class="layer level" id="level" inert aria-hidden="true">${layerHTML(true)}</div>
  </div>`;
  document.getElementById('run').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    unlockAudio();
    ({ close: openStopSheet, plus: addMinute, prev: goPrev, next: goNext, toggle: togglePause })[b.dataset.act]();
  });
  holdWake();
  paintStep();
  clearInterval(tickId); tickId = setInterval(tick, 200);
  tick();
}
function setSlot(name, html) { app.querySelectorAll(`[data-s="${name}"]`).forEach(el => { el.innerHTML = html; }); }
function jump() {
  const el = document.getElementById('run'); if (!el) return;
  el.classList.add('jump'); clearTimeout(jumpTimer); jumpTimer = setTimeout(() => el.classList.remove('jump'), 650);
}
function paintStep() {
  if (!document.getElementById('run')) return;
  const s = run.steps[run.i], nx = run.steps[run.i + 1];
  setSlot('routine', esc(run.name));
  setSlot('pos', `${run.i + 1}/${run.steps.length}`);
  setSlot('step', esc(s.name));
  document.getElementById('level').style.setProperty('--c', color(run.i));
  setSlot('nextLabel', nx ? '次へ' : '完了');
  setSlot('note', esc(s.note || ''));
  document.getElementById('run').classList.toggle('no-note', !s.note);
  fitNote();
  paintPause();
}
function fitNote() {
  /* Picks the largest size at which the whole comment fits in the space under +1分. */
  const notes = [...app.querySelectorAll('[data-s="note"]')];
  if (!notes.length || !run) return;
  const base = notes[0], sizes = [20, 18, 16, 15, 14, 13, 12];
  notes.forEach(n => { n.classList.remove('clamp'); n.style.webkitLineClamp = ''; n.style.maxHeight = ''; });
  let chosen = 12, fits = false;
  for (const px of sizes) {
    base.style.fontSize = px + 'px';
    if (base.scrollHeight <= base.clientHeight + 1) { chosen = px; fits = true; break; }
  }
  const lines = Math.max(1, Math.floor(base.clientHeight / (chosen * 1.55)));
  notes.forEach(n => {
    n.style.fontSize = chosen + 'px';
    if (!fits) { n.classList.add('clamp'); n.style.webkitLineClamp = lines; n.style.maxHeight = lines * chosen * 1.55 + 'px'; }
  });
}
addEventListener('resize', fitNote);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNote);
function paintPause() {
  const paused = run.endAt == null;
  document.getElementById('run').classList.toggle('paused', paused);
  setSlot('toggle', paused ? ICON.play.replace(/30/g, '40') : ICON.pause);
  app.querySelectorAll('[data-act="toggle"]').forEach(b => b.setAttribute('aria-label', paused ? '再開' : '一時停止'));
}
function digitsHTML(str) {
  return [...str].map(c => `<i class="${c === ':' ? 'c' : c === '+' ? 's' : ''}">${c}</i>`).join('');
}
function paintTime(now) {
  const left = leftNow(now), s = run.steps[run.i];
  const shown = left >= 0 ? fmt(Math.ceil(left / 1000)) : '+' + fmt(Math.floor(-left / 1000));
  if (shown !== shownTime) { shownTime = shown; setSlot('time', digitsHTML(shown)); }
  document.getElementById('level').style.setProperty('--r', Math.max(0, Math.min(1, left / (s.sec * 1000))).toFixed(4));
  const rest = run.steps.slice(run.i + 1).reduce((a, x) => a + x.sec, 0) * 1000;
  const finish = clock(now + Math.max(left, 0) + rest);
  const nx = run.steps[run.i + 1];
  const state = run.endAt == null ? '一時停止中' : `${finish}に終わる予定`;
  const html = (nx ? `次は <b>${esc(nx.name)}</b> ${fmt(nx.sec)}` : '最後のタスク') + `<br>${state}`;
  setSlot('next', html);
}
function step(toIndex, at, quiet) {
  /* Moves to a task. `at` is the moment the previous task ended, so catching up after the app was in the background keeps the schedule. */
  const running = run.endAt != null;
  run.i = toIndex; run.warned = false; run.over = false;
  if (running) run.endAt = at + ms(toIndex); else run.left = ms(toIndex);
  if (!quiet) { save(); jump(); paintStep(); shownTime = ''; paintTime(Date.now()); }
}
function closeOut(now, left) {
  run.spent[run.i] = ms(run.i) - left;
  if (run.i + 1 >= run.steps.length) { finish(); return true; }
  return false;
}
function tick() {

    while (run.endAt != null && now >= run.endAt) {
      const ended = run.endAt;
      if (closeOut(ended, 0)) return;
      step(run.i + 1, ended, true); moved = true;
    }
    if (moved) { save(); jump(); paintStep(); shownTime = ''; chime(); }
  }
  if (run.endAt != null) {
    const left = run.endAt - now, s = run.steps[run.i];
    if (!run.warned && s.sec >= 180 && left <= 60000 && left > 55000) { run.warned = true; chime([[660, 0]]); save(); }
    if (!run.over && !run.auto && left <= 0) { run.over = true; save(); chime(); }
  }

}
function goNext() {
  const now = Date.now(), left = leftNow(now);

}
function goPrev() {
  const now = Date.now();

  step(target, now);
}
function togglePause() {

function addMinute() {

}
function stopTimer() { clearInterval(tickId); tickId = null; run = null; store.run = null; save(); releaseWake(); }
function openStopSheet() {
  if (document.getElementById('scrim')) return;
  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <h2 id="st">このルーティンをやめますか</h2><p>進み具合は残りません。</p>
    <button class="btn" id="keep">続ける</button><button class="btn quiet" id="quit">やめる</button></div>`;
  document.body.appendChild(el);
  document.getElementById('keep').focus();
  document.getElementById('keep').onclick = () => el.remove();
  document.getElementById('quit').onclick = () => { el.remove(); stopTimer(); toHome(); };
}
function finish() {
  const r = run, spent = r.spent.reduce((a, b) => a + b, 0);
  const planned = r.steps.reduce((a, s) => a + s.sec, 0);
  stopTimer();
  view = 'done';
  app.innerHTML = `<div class="done">
    <div class="stripes">${r.steps.map((s, i) => `<div class="stripe" style="flex:${s.sec} 1 auto;--c:${color(i)};--n:${i}"><span>${esc(s.name)}</span><span>${fmt(s.sec)}</span></div>`).join('')}</div>
    <div class="done-foot"><h1>${esc(r.name)}、完了</h1><p>かかった時間 ${fmt(Math.round(spent / 1000))}（予定 ${fmt(planned)}）</p><button class="btn" id="home">ホームに戻る</button></div>
  </div>`;
  document.getElementById('home').onclick = toHome;
  chime();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && run && view === 'run') { holdWake(); tick(); }
});

/* Boot: a timer that was running when the app closed picks up where the clock says it should be. */
if (store.run && store.run.steps && store.run.steps.length) { run = store.run; showRun(); }
else { store.run = null; renderHome(); }
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
